name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and pack Windows x64 setup
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron and electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Set version from the tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          npm version $ver --no-git-tag-version --allow-same-version
          Write-Host "Building Lumina version $ver"

      # Unpacked build only: GloriaSetup replaces the NSIS installer.
      - name: Build Lumina (unpacked)
        shell: pwsh
        run: npm run build:dir -- --publish never

      - name: Collect runtime files into app-dist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'release/win-unpacked'
          if (-not (Test-Path (Join-Path $src 'Lumina.exe'))) { throw "Lumina.exe not found in $src" }
          if (-not (Test-Path (Join-Path $src 'Lumina Quick Note.exe'))) { throw "Lumina Quick Note.exe not found in $src" }
          New-Item -ItemType Directory -Force -Path app-dist | Out-Null
          # win-unpacked is exactly the runtime layout (exe, dlls, pak files, resources/).
          Copy-Item -Path (Join-Path $src '*') -Destination app-dist -Recurse -Force
          Get-ChildItem app-dist | Select-Object -First 50

      - name: Make sure the release exists
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'could not create the release' }
          }

      - name: Pack setup with GloriaSetup
        uses: projectGloria/GloriaSetup@v0.1.0
        with:
          app-dir: app-dist
          manifest: gloria.toml
          certificate: ${{ secrets.WINDOWS_PFX_BASE64 }}
          certificate-password: ${{ secrets.WINDOWS_PFX_PASSWORD }}
