appId: com.nihil.lumina
productName: Lumina
copyright: Copyright © 2026 Nihil

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

# The tray icon is loaded at runtime, so it has to ship beside the app rather
# than only being used to build it.
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/quicknote-icon.ico
    to: quicknote-icon.ico
  - from: resources/quicknote-icon.png
    to: quicknote-icon.png
  # Speech engines and models, carried inside the installer so a machine with
  # no network can still dictate. Populated by scripts/fetch-speech-packs.ps1;
  # when the folder is absent the app simply reports no packs bundled and the
  # build is ~1.8 GB smaller, which is what a CI build without them produces.
  - from: resources/speech
    to: speech
    filter:
      - "**/*"


asar: true
compression: normal

# Double-clicking a document opens it in Lumina. `role: Editor` puts the app
# under "Open with" without seizing an extension's existing default.
#
# Only markdown is registered to Lumina.exe here: it's the one type that may
# belong to Vault, and `src/main/fileRoute.ts` decides at launch whether a note
# goes to Vault or Quick Note. Every other text type is registered by
# `resources/installer.nsh` to "Lumina Quick Note.exe" instead, a separate
# executable so Windows can list Quick Note as its own app in "Open with" and
# Settings > Default apps. electron-builder can only point associations at the
# main exe, which is why those live in the NSIS script.
#
# Markdown carries the Quick Note icon too, so every text file Lumina handles
# looks the same in Explorer whichever app the user picked as its default.
fileAssociations:
  - ext: [md, markdown, mdx]
    name: Markdown Document
    description: Markdown note
    role: Editor
    icon: resources/quicknote-icon.ico

# The launcher has to sit beside Lumina.exe (it resolves it relative to itself),
# so it goes in extraFiles (app root) rather than extraResources (resources/).
extraFiles:
  - from: resources/launcher/Lumina Quick Note.exe
    to: Lumina Quick Note.exe

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lumina
  include: resources/installer.nsh
  # Vaults live wherever the user put them, so nothing of theirs is touched.
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}
