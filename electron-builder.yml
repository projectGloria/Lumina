appId: com.nihil.lumina
productName: Lumina
copyright: Copyright © 2026 Nihil

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

# The tray icon is loaded at runtime, so it has to ship beside the app rather
# than only being used to build it.
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  # Speech engines and models, carried inside the installer so a machine with
  # no network can still dictate. Populated by scripts/fetch-speech-packs.ps1;
  # when the folder is absent the app simply reports no packs bundled and the
  # build is ~1.8 GB smaller, which is what a CI build without them produces.
  - from: resources/speech
    to: speech
    filter:
      - "**/*"


asar: true
compression: normal

# Double-clicking a note opens it in Lumina. The installer registers these so
# the app shows up under "Open with"; Windows still lets the user decide which
# editor owns the extension by default.
fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown note
    role: Editor
    icon: resources/icon.ico
  - ext: markdown
    name: Markdown Document
    description: Markdown note
    role: Editor
    icon: resources/icon.ico
  - ext: mdx
    name: Markdown Document
    description: Markdown note
    role: Editor
    icon: resources/icon.ico

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lumina
  # Vaults live wherever the user put them, so nothing of theirs is touched.
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}
